name: ci
on:
  push:
  workflow_dispatch:
jobs:
  xtask-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # upstream de 21/10 estoura o disco do runner no `cargo test --workspace` (ld Bus error / No space left
    # on device): debuginfo so de linhas + sem incremental, e libera o que o runner traz e o build nao usa
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci

name: build-cli
on:
  push:
    branches: [build-*]
  workflow_dispatch:
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The test suites of the crates the layout-export work touches, every target run even
      # when one fails. Test binaries carry no debug info: with it, the io and engine suites
      # alone take over 30 GB on disk (the runner has 14 GB), which is what broke
      # `cargo test --workspace` upstream (see ci.yml).
      - run: cargo test -p cadcraft-dxf -p cadcraft-dwg -p cadcraft-io -p cadcraft-render -p cadcraft-engine -p cadcraft-cli --no-fail-fast
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_INCREMENTAL: 0
      - run: cargo build --release -p cadcraft-cli
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-cli
          path: target/release/cadcraft-cli
          retention-days: 3

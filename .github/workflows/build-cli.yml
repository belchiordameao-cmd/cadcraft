name: build-cli
on:
  push:
    branches: [build-*]
  workflow_dispatch:
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cadcraft-io
      - run: cargo test --release -p cadcraft-io --test pdf_sheets_peak -- --ignored --nocapture
      - run: |
          cp crates/io/tests/pdf_sheets_peak.rs /tmp/
          git checkout 9b2308b -- crates/io/src
          cp /tmp/pdf_sheets_peak.rs crates/io/tests/
          cargo test --release -p cadcraft-io --test pdf_sheets_peak -- --ignored --nocapture
          git checkout HEAD -- crates/io/src
      - run: cargo build --release -p cadcraft-cli
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-cli
          path: target/release/cadcraft-cli
          retention-days: 3
